# ===== 生产环境配置 =====
# 所有敏感配置通过环境变量或阿里云 Parameter Store 注入
spring:
  config:
    activate:
      on-profile: prod

  # 文件上传配置（多模态需要）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 生产数据库（PostgreSQL + pgvector）
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_db}
    username: ${DB_USERNAME:agent}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

# 生产日志 - INFO 级别，减少输出
logging:
  level:
    com.agent: INFO
    org.springframework.ai: WARN
    org.springframework: WARN
    root: WARN
