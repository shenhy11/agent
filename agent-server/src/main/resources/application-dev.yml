# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev

  # 开发环境使用 H2 内存数据库（可选，减少依赖）
  # 如果本地有 PostgreSQL 可注释此段
  # datasource:
  #   url: jdbc:h2:mem:agent_db
  #   driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
      chat:
        options:
          model: qwen-turbo
          temperature: 0.7

logging:
  level:
    com.agent: DEBUG
    org.springframework.ai: DEBUG
