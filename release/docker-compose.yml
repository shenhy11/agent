version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chronotech-agent-backend
    environment:
      # 在运行前请在宿主机或此处传入大模型 API KEY
      - SPRING_AI_ALIBABA_API_KEY=${DASHSCOPE_API_KEY}
    volumes:
      - ./model:/app/model  # 挂载微调脚本或数据
    restart: unless-stopped
    # 不需要暴露端口到宿主机，交由 Nginx 转发
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chronotech-agent-nginx
    ports:
      - "80:80"   # HTTP 公网访问端口
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
