name: chronotech-ai-lab

services:
  # ===== PostgreSQL + pgvector =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agent_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Spring Boot 后端 =====
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: agent-backend
    restart: unless-stopped
    environment:
      # 数据库连接
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-agent_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI & JWT
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 不对外暴露 8080，由 Nginx 代理
    expose:
      - "8080"
    volumes:
      - app_logs:/app/logs

  # ===== Nginx 反向代理 =====
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: agent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 如需 HTTPS，取消下行注释并挂载 SSL 证书
      # - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 挂载 SSL 证书（可选）
      # - ./docker/ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
  redis_data:
  app_logs:
